name: Weekly Good4 Analytics Report

on:
  schedule:
    # Her Cuma akşamı Türkiye saatiyle 23:00 (UTC 20:00)
    - cron: '0 20 * * 5'
  workflow_dispatch: # GitHub web arayüzünden manuel tetikleme desteği

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Kilitlenme ve kota aşımını önleyen üst sınır

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase Admin SDK (if service account configured)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            npm install firebase-admin --no-save
          fi

      - name: Run Safe Analytics Report Generator
        id: generate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: good4tr-v2
        run: |
          node tools/generate-weekly-report.mjs

      - name: Commit and Push (Strictly Single Report File Only)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Rapor yolunu script çıktısından al, yoksa docs/reports altındaki en son rapora bak
          REPORT_FILE="${{ steps.generate.outputs.report_path }}"
          if [ -z "$REPORT_FILE" ] || [ ! -f "$REPORT_FILE" ]; then
            REPORT_FILE=$(ls -t docs/reports/good4-analytics-report-*.html 2>/dev/null | head -n 1)
          fi

          if [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ]; then
            git add "$REPORT_FILE"
            if git diff --staged --quiet; then
              echo "No changes to commit for report: $REPORT_FILE."
            else
              REPORT_DATE="${{ steps.generate.outputs.report_date }}"
              if [ -z "$REPORT_DATE" ]; then
                REPORT_DATE=$(basename "$REPORT_FILE" .html | sed 's/good4-analytics-report-//')
              fi
              git commit -m "docs(analytics): automated weekly production report for ${REPORT_DATE}"
              git pull --rebase origin main || true
              git push origin main
              echo "Report ($REPORT_FILE) successfully pushed to main branch."
            fi
          else
            echo "Report file $REPORT_FILE was not found."
            exit 1
          fi

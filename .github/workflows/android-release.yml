name: Android Release (Google Play)

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Dağıtım Kanalı'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      dry_run:
        description: 'Sadece AAB derle ve artifact olarak kaydet (Play Store yüklemesi yapma)'
        required: false
        default: false
        type: boolean

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Deploy to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Keystore and Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret bulunamadı. Lütfen repo ayarlarına ekleyin."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          cat <<EOF > keystore.properties
          storeFile=keystore/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Keystore ve signing yapılandırması hazırlandı."

      - name: Determine Version Code
        id: versioning
        run: |
          # Baz versionCode: 21 (composeApp/build.gradle.kts)
          # Her GitHub run_number ile benzersiz ve artan versionCode üretilir
          BASE_VERSION_CODE=21
          COMPUTED_VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$COMPUTED_VERSION_CODE" >> $GITHUB_ENV
          echo "Computed versionCode: $COMPUTED_VERSION_CODE (Base: $BASE_VERSION_CODE + Run: $GITHUB_RUN_NUMBER)"
          echo "### Sürüm Bilgisi 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **Otomatik VersionCode:** \`$COMPUTED_VERSION_CODE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch / Ref:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Kanal:** \`${{ inputs.track || 'internal' }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Build Signed Prod Release AAB
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          ./gradlew :composeApp:bundleProdRelease \
            -Pgood4.versionCode=${{ env.VERSION_CODE }} \
            --stacktrace

      - name: Archive AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: good4-prod-release-v${{ env.VERSION_CODE }}
          path: composeApp/build/outputs/bundle/prodRelease/composeApp-prod-release.aab
          retention-days: 14

      - name: Archive Proguard Mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-v${{ env.VERSION_CODE }}
          path: composeApp/build/outputs/mapping/prodRelease/mapping.txt
          retention-days: 14

      - name: Deploy to Google Play Console
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.good4
          releaseFiles: composeApp/build/outputs/bundle/prodRelease/composeApp-prod-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          changesNotSentForReview: true
          mappingFile: composeApp/build/outputs/mapping/prodRelease/mapping.txt

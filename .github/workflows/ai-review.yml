name: Good4 AI Architecture Review

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_BRANCH: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python .github/scripts/ai_review.py
